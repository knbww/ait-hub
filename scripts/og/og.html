<!doctype html>
<!-- The link preview of aitclub.org (site/public/og.png, 1200×630), drawn in the club's tokens.
     Regenerate after changing it, from the repository root:
       google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
         --screenshot=site/public/og.png "file://$PWD/scripts/og/og.html" -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Manrope Variable'; font-weight: 200 800; src: url(../../node_modules/@fontsource-variable/manrope/files/manrope-cyrillic-wght-normal.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Manrope Variable'; font-weight: 200 800; src: url(../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3f2ee; font-family: 'Manrope Variable', Arial, sans-serif; color: #141414; }
  .blob { position: absolute; border-radius: 9999px; filter: blur(90px); }
  .b1 { width: 460px; height: 460px; left: -120px; top: -160px; background: #40464c; opacity: .55; }
  .b2 { width: 520px; height: 520px; right: -140px; top: 40px; background: #750014; opacity: .38; }
  .b3 { width: 380px; height: 380px; left: 380px; bottom: -260px; background: #e8794a; opacity: .45; }
  .card { position: absolute; inset: 56px; border-radius: 32px; background: rgb(255 255 255 / .42); border: 2px solid rgb(255 255 255 / .85); box-shadow: 0 8px 32px rgb(50 30 30 / .10); backdrop-filter: blur(40px); padding: 64px 72px; box-sizing: border-box; }
  .sub { margin: 26px 0 0; font-size: 26px; color: #4a4540; }
  h1 { margin: 0; font-size: 76px; line-height: 1.06; font-weight: 300; letter-spacing: -1.5px; }
  .accent { background: linear-gradient(100deg, #750014 10%, #b3242f 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 14px; }
  .chip { padding: 12px 24px; border-radius: 9999px; background: rgb(255 255 255 / .7); border: 1px solid rgb(255 255 255 / .95); font-size: 22px; color: #2e2a26; }
  .logo { position: absolute; right: 58px; bottom: 50px; height: 76px; }
</style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <div class="card">
    <h1>Понимать технологии<br><span class="accent">и строить свои</span></h1>
    <p class="sub">Технологический клуб для 7–12 классов</p>
    <div class="chips"><span class="chip">Искусственный интеллект</span><span class="chip">Алгоритмы</span><span class="chip">Стартапы</span></div>
    <img class="logo" src="../../public/aitlogo.png" alt="">
  </div>
</body>
</html>
