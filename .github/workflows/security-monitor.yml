name: Security monitor

# Every morning checks the live sites from the outside: headers, TLS, DNS, the public API
# (scripts/security/live-check.mjs). No secrets and no installed packages. GitHub mails the
# repository owner when a run fails: that is the alarm.

on:
  schedule:
    - cron: '30 2 * * *' # 07:30 in Kazakhstan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/security/live-check.mjs
