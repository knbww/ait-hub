# Supabase project config — https://supabase.com/docs/guides/local-development/cli/config
# Used by the CLI for `supabase db push`, `supabase config push`, type generation,
# and (with Docker) `supabase start`. Auth provider/hook settings here mirror what
# must also be enabled in the cloud dashboard.
project_id = "ait-hub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://hub.aitclub.org", "https://ait-hub.pages.dev"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# The club has no email-sending domain, so confirmation mail wouldn't arrive. A join code is
# required to sign up anyway. Keep this OFF in the cloud dashboard too.
enable_confirmations = false

# Accounts are created only with a club join code (handle_new_user in
# supabase/migrations/20261008110000_club_model.sql). GitHub is a second way in for members who
# already joined: Supabase links it to the account with the same email. A GitHub sign-in without
# such an account is rejected by the same trigger.
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

# Injects the member's role as a JWT claim. Optional: access rules read roles from the
# database, not the token. In the cloud dashboard: Authentication > Hooks > Custom Access Token.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
